name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            zig: aarch64-macos
            sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
          - os: ubuntu-latest
            zig: x86_64-linux
            sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig
        env:
          ZIG_TARGET: ${{ matrix.zig }}
          ZIG_SHA256: ${{ matrix.sha256 }}
        run: |
          name="zig-$ZIG_TARGET-$ZIG_VERSION"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz" -o zig.tar.xz
          echo "$ZIG_SHA256  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: zig fmt --check build.zig src bench test examples
      - run: zig build test
      - run: zig build test -Doptimize=ReleaseSafe
      - run: zig build test -Doptimize=ReleaseFast
      - name: Fuzz
        # Zig 0.17 Debug builds on x86_64 Linux use the self-hosted backend,
        # which emits no coverage instrumentation for the fuzzer.
        if: matrix.os == 'macos-latest'
        run: zig build test --fuzz=50K
      - run: zig build perf-check
      - name: Build a consumer project from the package
        if: matrix.os == 'ubuntu-latest'
        run: |
          git archive --format=tar.gz --prefix=zig-hilbert/ -o "$RUNNER_TEMP/zig-hilbert.tar.gz" HEAD
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > build.zig.zon <<'EOF'
          .{
              .name = .zh_consumer,
              .version = "0.0.0",
              .fingerprint = 0xda899f64f3128b8,
              .minimum_zig_version = "0.17.0",
              .dependencies = .{},
              .paths = .{""},
          }
          EOF
          cat > build.zig <<'EOF'
          const std = @import("std");
          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const dep = b.dependency("zig_hilbert", .{ .target = target, .optimize = optimize });
              const exe = b.addExecutable(.{ .name = "consumer", .root_module = b.createModule(.{
                  .root_source_file = b.path("main.zig"),
                  .target = target,
                  .optimize = optimize,
                  .imports = &.{.{ .name = "hilbert", .module = dep.module("hilbert") }},
              }) });
              const run = b.addRunArtifact(exe);
              run.expectStdOutEqual("1555040834\n");
              b.step("run", "Run").dependOn(&run.step);
          }
          EOF
          cat > main.zig <<'EOF'
          const std = @import("std");
          const hilbert = @import("hilbert");
          pub fn main(init: std.process.Init) !void {
              var buf: [32]u8 = undefined;
              var out = std.Io.File.stdout().writerStreaming(init.io, &buf);
              try out.interface.print("{d}\n", .{hilbert.encode2(16, 12345, 54321)});
              try out.interface.flush();
          }
          EOF
          zig fetch --save=zig_hilbert "$RUNNER_TEMP/zig-hilbert.tar.gz"
          zig build run
      - name: Cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in aarch64-linux x86_64-windows wasm32-wasi arm-linux-musleabihf x86_64-macos; do
            zig build test-build install -Dtarget="$target"
          done
